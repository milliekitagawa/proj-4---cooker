<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tatung Electric Cooker</title>
<link rel="stylesheet" href="style.css">
</head>
<body><main class="app"><h1>Tatung Electric Cooker</h1><p>A simple three-state simulation</p>
<div class="cooker" aria-label="Illustration of a green Tatung electric cooker"><div class="lid-handle"></div><div class="lid"></div><div class="rim"></div><div class="handle left"></div><div class="handle right"></div><div class="body"><div class="brand">TATUNG<small>大同電鍋</small></div><div class="panel"><div class="indicator"><span id="redLight" class="light red"></span><span>COOK</span></div><div class="indicator"><span id="greenLight" class="light green"></span><span>KEEP WARM</span></div></div><div class="appliance-switches"><div class="switch-control"><span id="powerLabel">POWER</span><div class="toggle-row"><span>OFF</span><button id="powerButton" class="power-switch" role="switch" aria-labelledby="powerLabel" aria-checked="false"><span class="toggle-thumb"></span></button><span>ON</span></div></div><div class="switch-control"><div class="vertical-toggle"><span>UP</span><button id="cookSwitch" class="cook-switch" role="switch" aria-label="Cooking switch: down to cook, up to keep warm" aria-checked="false"><span class="toggle-thumb"></span></button><span>DOWN</span></div></div></div></div></div>
<div class="status" id="status" role="status">OFF</div><div class="water-display"><span>Water level</span><div id="waterGauge" class="water-gauge" role="progressbar" aria-label="Water remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="waterLevel" class="water-level"></div></div><span id="waterText">100%</span></div><div class="hint">Turn on power, then press the cook switch DOWN. Water evaporates over 10 seconds, then the switch pops UP to KEEP WARM. Each new cooking cycle starts with fresh water.</div></main>
<script src="script.js"></script></body></html>
